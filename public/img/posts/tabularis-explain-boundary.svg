<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" font-family="system-ui,-apple-system,'Segoe UI',sans-serif">
<rect width="760" height="440" rx="10" fill="#111214" stroke="rgba(255,255,255,0.10)"/>
<text x="24" y="34" font-size="16.5" font-weight="650" fill="#ffffff">Who runs the query vs who understands the plan</text>
<text x="24" y="53" font-size="12.5" fill="#898781">The boundary drawn by PR #536: hosts stop at raw EXPLAIN output</text>
<!-- host: desktop -->
<rect x="24" y="80" width="252" height="124" rx="8" fill="#16181c" stroke="rgba(255,255,255,0.14)"/>
<text x="40" y="106" font-size="13" font-weight="650" fill="#ffffff">Tabularis desktop: Rust drivers</text>
<text x="40" y="128" font-size="11.5" fill="#c3c2b7">runs the database-specific statement</text>
<text x="40" y="145" font-size="11.5" fill="#c3c2b7">keeps the version fallback chain</text>
<text x="40" y="162" font-size="11.5" fill="#c3c2b7">returns the raw EXPLAIN output</text>
<text x="40" y="180" font-size="11" fill="#898781">engine · format · payload</text>
<!-- host: web -->
<rect x="24" y="224" width="252" height="96" rx="8" fill="#16181c" stroke="rgba(255,255,255,0.14)"/>
<text x="40" y="250" font-size="13" font-weight="650" fill="#ffffff">explain.tabularis.dev: browser</text>
<text x="40" y="272" font-size="11.5" fill="#c3c2b7">you paste the EXPLAIN output</text>
<text x="40" y="289" font-size="11.5" fill="#c3c2b7">nothing ever leaves the tab</text>
<!-- arrows -->
<line x1="276" x2="336" y1="142" y2="150" stroke="#3987e5" stroke-width="1.5"/>
<path d="M336,150 l-9,-4 1,8 Z" fill="#3987e5"/>
<text x="306" y="130" text-anchor="middle" font-size="10.5" fill="#898781">raw text</text>
<line x1="276" x2="336" y1="272" y2="252" stroke="#199e70" stroke-width="1.5"/>
<path d="M336,252 l-9,-1 3,8 Z" fill="#199e70"/>
<text x="306" y="248" text-anchor="middle" font-size="10.5" fill="#898781">raw text</text>
<!-- package box -->
<rect x="340" y="80" width="396" height="240" rx="8" fill="#16181c" stroke="rgba(255,255,255,0.14)"/>
<text x="356" y="106" font-size="14" font-weight="650" fill="#ffffff">@tabularis/explain</text>
<text x="720" y="106" text-anchor="end" font-size="11" fill="#898781">npm 0.1.0  ·  pnpm workspace:*</text>
<!-- core entry -->
<rect x="356" y="120" width="364" height="60" rx="6" fill="#111214" stroke="#199e70"/>
<text x="370" y="141" font-size="11.5" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" fill="#199e70">"."</text>
<text x="398" y="141" font-size="11.5" fill="#c3c2b7">parsers → ExplainPlan → exclusive metrics ·</text>
<text x="398" y="156" font-size="11.5" fill="#c3c2b7">diagnostics · stats · formatters</text>
<text x="398" y="172" font-size="11" font-weight="600" fill="#199e70">no runtime dependencies at all</text>
<!-- react entry -->
<rect x="356" y="188" width="364" height="56" rx="6" fill="#111214" stroke="rgba(255,255,255,0.14)"/>
<text x="370" y="209" font-size="11.5" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" fill="#3987e5">"./react"</text>
<text x="440" y="209" font-size="11.5" fill="#c3c2b7">graph, table, diagram, stats, node details</text>
<text x="370" y="230" font-size="11" fill="#898781">peers, all optional: react, react-i18next, @xyflow/react, dagre</text>
<!-- flow entry -->
<rect x="356" y="252" width="364" height="52" rx="6" fill="#111214" stroke="rgba(255,255,255,0.14)"/>
<text x="370" y="273" font-size="11.5" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" fill="#3987e5">"./flow"</text>
<text x="432" y="273" font-size="11.5" fill="#c3c2b7">ReactFlow node/edge adapter + dagre layout,</text>
<text x="432" y="290" font-size="11.5" fill="#c3c2b7">split out so the core never pulls a graph library</text>
<!-- stays behind -->
<rect x="24" y="348" width="712" height="64" rx="8" fill="none" stroke="rgba(255,255,255,0.14)" stroke-dasharray="4 4"/>
<text x="40" y="374" font-size="12" font-weight="600" fill="#898781">Stays in the desktop app, deliberately</text>
<text x="40" y="394" font-size="11.5" fill="#898781">database statements · window and file handling · AI provider integration · raw-output editor</text>
</svg>
