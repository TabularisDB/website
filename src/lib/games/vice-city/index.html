<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>Vice City Getaway</title>
    <link rel="stylesheet" href="./drive.css">
    <script src="./drive.js" defer></script>
</head>
<body>
    <main class="vice-demo">
        <div class="vice-drive-workspace" aria-label="Vice City Getaway road">
            <h1>Vice City Getaway</h1>
        </div>
        <div class="vice-controls" role="group" aria-label="Getaway controls">
            <button type="button" data-drive="ArrowLeft" aria-label="Steer left">←</button>
            <button type="button" data-drive="ArrowRight" aria-label="Steer right">→</button>
            <button type="button" data-drive="ArrowUp">Jump</button>
            <button type="button" data-drive="x">Pulse</button>
        </div>
        <p class="vice-help">Space to jump · ← / → to steer · X to fire · Esc to stop</p>
        <noscript>Turn on JavaScript to play Vice City Getaway.</noscript>
    </main>
</body>
</html>
